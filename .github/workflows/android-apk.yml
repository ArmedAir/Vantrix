name: Build Android app (APK)

# Builds the Capacitor Android shell around https://vantrix.ink and uploads an
# installable debug APK as a workflow artifact. Run it from the Actions tab
# ("Run workflow"), or it runs automatically when mobile-capacitor/ changes.
# Play Store release signing is a separate step -- see NATIVE_APP.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-capacitor/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-capacitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-capacitor/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile-capacitor/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vantrix-android-debug-apk
          path: mobile-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
