name: CI

# verify and build must NEVER be conditional on E2E secrets — they prove
# typecheck/lint/unit-tests/build itself still work, independent of whether
# this repo has E2E credentials configured. Only the e2e job (and its
# complementary e2e-skip-notice) are secret-gated — see ARCH-17.
#
# SECRETS-IN-IF-FIX: two attempts, two confirmed-live failures (push,
# check the Actions run, see conclusion "failure" with zero jobs
# scheduled — a parse-time rejection, not a runtime one), before landing
# on the pattern below:
#   1. `if: secrets.E2E_TEST_EMAIL != ''` directly on e2e/e2e-skip-notice
#      — `secrets` is not a valid named-value in ANY `if:` (job or step).
#   2. Mirroring secrets into a job-level `env:` and conditioning on
#      `if: env.E2E_TEST_EMAIL != ''` instead — looks like the documented
#      fix for #1 (and `env:` CAN read `secrets` fine), but GitHub's own
#      context-availability table does not list `env` as available in a
#      job-level `if:` either — only `github`, `needs`, `vars`, `inputs`
#      are. Same rejection, same zero jobs.
# The pattern that actually works: `secrets` IS always readable inside a
# `run:` step (job-level `if:` is what's restricted, not step execution).
# check-e2e-secrets below computes the boolean in a step, publishes it as
# a job OUTPUT, and e2e/e2e-skip-notice condition on
# needs.check-e2e-secrets.outputs.present — `needs` is on the allowed list.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          CRON_TIER: free

  # check-e2e-secrets / e2e / e2e-skip-notice: see SECRETS-IN-IF-FIX note
  # at the top of this file for why this is a separate job rather than a
  # condition directly on e2e itself.
  check-e2e-secrets:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        run: |
          if [ -n "${E2E_TEST_EMAIL:-}" ] && [ -n "${E2E_TEST_PASSWORD:-}" ] && [ -n "${SUPABASE_URL:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

  e2e:
    needs: [build, check-e2e-secrets]
    if: needs.check-e2e-secrets.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  e2e-skip-notice:
    needs: [build, check-e2e-secrets]
    if: needs.check-e2e-secrets.outputs.present != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipping E2E — E2E_TEST_EMAIL/E2E_TEST_PASSWORD/NEXT_PUBLIC_SUPABASE_URL not all set as repo secrets. verify/build still ran and passed."
