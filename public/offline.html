<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Vantrix</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #0A0A0A;
    color: #F5F1E8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 360px; }
  img { width: 56px; height: 56px; border-radius: 12px; margin-bottom: 16px; }
  h1 { font-size: 17px; margin: 0 0 8px; font-weight: 600; }
  p { font-size: 14px; color: #9C9587; margin: 0 0 20px; line-height: 1.5; }
  button {
    background: linear-gradient(to bottom, #E8C468, #C9963E);
    color: #160F02;
    border: none;
    border-radius: 6px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/icons/icon-192.png" alt="Vantrix" />
    <h1>You're offline</h1>
    <p>Vantrix needs a connection to reach your companions. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
